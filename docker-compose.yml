# PostgreSQL for local development:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: rideport-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rideport
    ports:
      - "5432:5432"
    volumes:
      - rideport_pgdata:/var/lib/postgresql/data
volumes:
  rideport_pgdata:
